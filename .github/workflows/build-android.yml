name: Build Android AAB and APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android App Bundle (.aab) and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android App Bundle (.aab) for Google Play
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Build Android APK (.apk) for Direct Testing
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-release-bundle-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Android APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
